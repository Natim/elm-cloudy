name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: elm-tooling/setup-elm@v3
        with:
          elm-version: 0.19.1
      - name: Build PWA
        working-directory: elm-cloudy-pwa
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: elm-cloudy-pwa/dist
      - id: deployment
        uses: actions/deploy-pages@v4
