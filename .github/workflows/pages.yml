name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: elm-cloudy-pwa/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('**/elm.json', 'elm-cloudy-pwa/package-lock.json') }}
      - name: Build PWA
        working-directory: elm-cloudy-pwa
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: elm-cloudy-pwa/dist
      - id: deployment
        uses: actions/deploy-pages@v4
