name: CI

on:
  push:
  pull_request:

jobs:
  elm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elm-cloudy-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: elm-cloudy-pwa/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('**/elm.json', 'elm-cloudy-pwa/package-lock.json') }}
      - run: npm ci
      - name: HTTP client
        run: |
          export PATH="$GITHUB_WORKSPACE/elm-cloudy-pwa/node_modules/.bin:$PATH"
          npx elm-format --validate ../elm-cloudy-http-client/src/
          npx elm make ../elm-cloudy-http-client/src/Cloudy.elm --output=/dev/null
          cd ../elm-cloudy-http-client/tests && npx elm-test-rs src/Tests.elm
      - name: PWA Elm
        run: |
          npx elm-format --validate src/
          npm run build:elm
          npm test
      - name: elm-analyse
        run: |
          export PATH="$GITHUB_WORKSPACE/elm-cloudy-pwa/node_modules/.bin:$PATH"
          npx elm-analyse
          cd ../elm-cloudy-http-client/tests && npx elm-analyse
      - name: PWA production build
        run: npm run build
