repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
        exclude: ^elm-cloudy-.*/elm\.json$

  - repo: local
    hooks:
      - id: elm-cloudy-checks
        name: elm-format and elm-analyse (CI parity)
        entry: scripts/pre-commit-elm-checks.sh
        language: system
        pass_filenames: false
        files: ^(elm-cloudy-pwa/|elm-cloudy-http-client/|scripts/pre-commit-elm-checks\.sh|\.github/workflows/)
